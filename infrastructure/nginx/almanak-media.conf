# Bloc à inclure dans le server{} Nginx d'almanak.neovillage.org
# (ou à ajouter manuellement dans /etc/nginx/sites-available/almanak)

# Permet les uploads jusqu'à 10 Mo (photos 5 Mo + bannières 8 Mo)
client_max_body_size 10M;

location /media/ {
    alias /opt/almanak/data/media/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
