<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Almanak{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <style>
        :root {
            --ink: #232620; --ink-soft: #5b5c4f;
            --bg: #efece0; --surface: #f9f7ee; --line: #d9d2ba;
            --accent: #3b5d42; --logo-vert: #2E4A33; --logo-or: #E1A43B;
        }
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 0 1rem 2rem; background: var(--bg); color: var(--ink); }
        nav { display: flex; align-items: center; gap: 1.2rem; padding: .9rem 0; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
        nav a { text-decoration: none; color: var(--ink-soft); font-size: .9rem; }
        nav a:hover { color: var(--ink); text-decoration: underline; }
        .nav-logo { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: 1rem; color: var(--ink); margin-right: auto; }
        .nav-logo svg { width: 28px; height: 28px; flex-shrink: 0; }
        .lg-trait { fill: none; stroke: var(--logo-vert); stroke-width: 3.6; stroke-miterlimit: 10; }
        .lg-or    { fill: none; stroke: var(--logo-or);   stroke-width: 3.96; }
        .lg-noeud { fill: var(--logo-vert); }
        .btn-deconnexion { background: none; border: none; padding: 0; font: inherit; font-size: .9rem; color: var(--ink-soft); cursor: pointer; }
        .btn-deconnexion:hover { color: var(--ink); text-decoration: underline; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="nav-logo">
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle class="lg-trait" cx="50" cy="50" r="47" transform="rotate(-90 50 50)"/>
                <path class="lg-trait" d="M43.82 10.99A39.5 39.5 0 0 0 13.12 64.16M19.3 74.86A39.5 39.5 0 0 0 80.7 74.86M86.88 64.16A39.5 39.5 0 0 0 56.18 10.99"/>
                <path class="lg-trait" d="M15.79 69.75L50 10.5L84.21 69.75"/>
                <path class="lg-trait" d="M25.03 74.75L50 31.5L74.97 74.75"/>
                <circle class="lg-noeud" cx="50"    cy="10.5"  r="4.14"/>
                <circle class="lg-noeud" cx="15.79" cy="69.75" r="4.14"/>
                <circle class="lg-noeud" cx="84.21" cy="69.75" r="4.14"/>
                <circle class="lg-or"    cx="50"    cy="70.5"  r="9.75" transform="rotate(-90 50 70.5)"/>
            </svg>
            Almanak
        </a>
        {% if user.is_authenticated %}
            <a href="/profil/">Mon profil</a>
            <form method="post" action="/deconnexion/" style="display:inline">
                {% csrf_token %}
                <button type="submit" class="btn-deconnexion">Déconnexion</button>
            </form>
        {% else %}
            <a href="/connexion/">Connexion</a>
        {% endif %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
