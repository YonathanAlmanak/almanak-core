{% extends "base.html" %}
{% block title %}Connexion — Almanak{% endblock %}
{% block content %}
<h1>Connexion</h1>

<p style="margin-bottom:1.5rem">
  <a href="/oauth/nextcloud/login/" style="display:inline-block;padding:.6rem 1.4rem;background:#0082c9;color:#fff;border-radius:6px;text-decoration:none;font-size:1rem">
    ☁ Se connecter avec Neovillage Nextcloud
  </a>
</p>

<details style="margin-top:1rem">
  <summary style="cursor:pointer;color:#666;font-size:.9rem">Connexion par mot de passe</summary>
  <div style="margin-top:.8rem">
    {% if form.errors %}
    <p style="color:red">Identifiants incorrects. Réessaie.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <p><label>Courriel ou nom d'utilisateur<br>
        <input type="text" name="username" autofocus required style="width:100%;max-width:360px;padding:.5rem;font-size:1rem"></label></p>
      <p><label>Mot de passe<br>
        <input type="password" name="password" required style="width:100%;max-width:360px;padding:.5rem;font-size:1rem"></label></p>
      <p><button type="submit" style="padding:.5rem 1.5rem;font-size:1rem;cursor:pointer">Se connecter</button></p>
    </form>
  </div>
</details>
{% endblock %}
